name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [restaurant-service, order-service, identity-service]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: restaurant_db
          POSTGRES_USER: restaurant_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant_user -d restaurant_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: ./gradlew test
        env:
          POSTGRES_PORT: 5432
          POSTGRES_DB: restaurant_db
          POSTGRES_USER: restaurant_user
          POSTGRES_PASSWORD: ci_password
