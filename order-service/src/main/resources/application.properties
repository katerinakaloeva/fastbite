spring.application.name=order-service
server.port=${ORDER_SERVICE_PORT:8081}
spring.datasource.url=jdbc:postgresql://${ORDER_DB_HOST:localhost}:${ORDER_DB_PORT:5432}/${ORDER_DB_NAME:order_db}
spring.datasource.username=${ORDER_DB_USER}
spring.datasource.password=${ORDER_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
restaurant-service.base-url=${RESTAURANT_SERVICE_BASE_URL:http://localhost:8080}
restaurant-service.connect-timeout=${RESTAURANT_SERVICE_CONNECT_TIMEOUT:2s}
restaurant-service.read-timeout=${RESTAURANT_SERVICE_READ_TIMEOUT:5s}